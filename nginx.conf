# Initial Nginx site template. deploy.sh replaces __API_HOST__ once and then
# preserves this file because Certbot owns its TLS directives afterward.
# Proxy behavior lives in a separate include that remains safely deployable.

server {
    listen 80;
    listen [::]:80;
    server_name __API_HOST__;

    server_tokens off;
    client_max_body_size 30m;

    access_log /var/log/nginx/upnod-api.access.log;
    error_log  /var/log/nginx/upnod-api.error.log;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    include /etc/nginx/snippets/upnod-api-proxy.conf;
}
